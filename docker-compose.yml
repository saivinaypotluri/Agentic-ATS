version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hirewise-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./hirewise.db:/app/hirewise.db
    environment:
      - DATABASE_URL=sqlite:///./hirewise.db
    restart: unless-stopped
    networks:
      - hirewise-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: hirewise-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hirewise-network

networks:
  hirewise-network:
    driver: bridge
